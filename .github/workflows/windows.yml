name: Windows (Electron — instalador e portable)

on:
  pull_request:
    paths:
      - 'native/windows/**'
      - '.github/workflows/windows.yml'
  push:
    branches: [main]
    paths:
      - 'native/windows/**'
      - 'scripts/build_pwa.py'
      - 'scripts/cc_build.py'
      - 'scripts/fonts/**'
      - 'download/conta-comigo/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar Pillow (ícones)
        run: pip install pillow

      - name: Gerar PWA base (mesmo motor do jogo)
        run: python scripts/build_pwa.py
        env:
          BASE: ${{ github.workspace }}

      - name: Copiar PWA para dentro do Electron
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path native/windows/app | Out-Null
          Copy-Item download/conta-comigo-pwa/* native/windows/app -Recurse -Force
          Remove-Item native/windows/app/leia-me-android.md -ErrorAction SilentlyContinue
          Get-ChildItem native/windows/app | Select-Object Name

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Dependências (npm ci)
        working-directory: native/windows
        run: npm ci

      # Identidade do pacote da Microsoft Store: vem do Partner Center (Gerenciamento de
      # produto > Identidade do produto). Em Settings > Variables (Actions) defina
      # APPX_IDENTITY_NAME, APPX_PUBLISHER e APPX_PUBLISHER_DISPLAY_NAME; sem elas
      # o .appx sai com os valores de teste do package.json e serve só para validar
      # o empacotamento.
      - name: Build instalador NSIS + portable + MSIX/APPX (x64)
        working-directory: native/windows
        shell: pwsh
        run: |
          $o = @()
          if ($env:APPX_IDENTITY_NAME) { $o += "-c.appx.identityName=$env:APPX_IDENTITY_NAME" }
          if ($env:APPX_PUBLISHER) { $o += "-c.appx.publisher=$env:APPX_PUBLISHER" }
          if ($env:APPX_PUBLISHER_DISPLAY_NAME) { $o += "-c.appx.publisherDisplayName=$env:APPX_PUBLISHER_DISPLAY_NAME" }
          npx electron-builder --win nsis portable appx --publish never @o
        env:
          APPX_IDENTITY_NAME: ${{ vars.APPX_IDENTITY_NAME }}
          APPX_PUBLISHER: ${{ vars.APPX_PUBLISHER }}
          APPX_PUBLISHER_DISPLAY_NAME: ${{ vars.APPX_PUBLISHER_DISPLAY_NAME }}

      - name: Extrair versão
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content native/windows/package.json | ConvertFrom-Json).version
          "tag=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: conta-comigo-windows-${{ steps.ver.outputs.tag }}
          path: |
            native/windows/dist/*.exe
            native/windows/dist/*.appx
          if-no-files-found: error
          retention-days: 30
