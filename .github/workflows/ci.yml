name: CI (build + acessibilidade)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-e-a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar Pillow (ícones)
        run: pip install pillow

      - name: Builds das extensões (Chrome + Firefox) e da PWA
        run: |
          python scripts/build_packages.py
          python scripts/build_pwa.py

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Sintaxe do JavaScript
        run: for f in download/conta-comigo/js/*.js download/conta-comigo/background.js; do node --check "$f"; done

      - name: Textos em pt/en/es (nenhuma chave faltando)
        run: node scripts/i18n_check.cjs

      - name: Testes unitários do motor (senha, backup, geradores, regras)
        run: node --test tests/*.test.cjs

      - name: Cópias sincronizadas (tela do jogo, workflows do kit, versão)
        run: node scripts/sync_check.cjs

      # navegador do Playwright em cache, chaveado pela versão (troque as duas juntas)
      - name: Cache do Chromium do Playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-${{ runner.os }}

      - name: Instalar Playwright + axe-core
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 axe-core@4.10.2
          npx playwright install chromium
          # o ubuntu-latest já traz as bibliotecas do Chromium; o apt (--with-deps
          # baixava fontes CJK e xvfb por ~7 min) só roda se o navegador não abrir
          node -e "require('playwright').chromium.launch().then((b) => b.close())" \
            || npx playwright install-deps chromium

      - name: Acessibilidade (falha em violação nova)
        run: node scripts/a11y_check.cjs

      - name: Responsividade (celulares e tablets, retrato e paisagem)
        run: node scripts/resp_check.cjs

      - name: Texto do sistema a 200% (nada sai da tela)
        run: CC_TEXTO=200 node scripts/resp_check.cjs

      - uses: actions/upload-artifact@v7
        with:
          name: pacotes-ci
          path: download/conta-comigo-*.zip
          retention-days: 7
