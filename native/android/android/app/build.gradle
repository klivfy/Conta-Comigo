apply plugin: 'com.android.application'

// Upload key fora do repositório — ver native/android/keystore/README.md.
// Lida de variáveis de ambiente (CI: GitHub Secrets) ou de ~/.gradle/gradle.properties.
def signProp = { String env, String prop ->
    System.getenv(env) ?: (project.hasProperty(prop) ? project.property(prop) : null)
}
def ksPath  = signProp("ANDROID_KEYSTORE_PATH", "contaComigo.keystorePath")
def ksPass  = signProp("ANDROID_KEYSTORE_PASS", "contaComigo.keystorePass")
def ksAlias = signProp("ANDROID_KEY_ALIAS", "contaComigo.keyAlias")
def keyPass = signProp("ANDROID_KEY_PASS", "contaComigo.keyPass")
def hasSigning = ksPath && ksPass && ksAlias && keyPass && file(ksPath).exists()

android {
    namespace = "com.klivfy.conta.comigo.matematica"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.klivfy.conta.comigo.matematica"
        minSdkVersion rootProject.ext.minSdkVersion        // 24: a Proteção Automática do Play exige
        targetSdkVersion rootProject.ext.targetSdkVersion  // 36: o Google Play exige
        versionCode 272        // v2.7.2
        versionName "2.7.2"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        if (hasSigning) {
            release {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            // Sem keystore configurado, o release sai sem assinatura (não instalável).
            if (hasSigning) signingConfig signingConfigs.release
            // R8: encolhe o código; o mapping.txt vai dentro do .aab e o Play o usa para desofuscar falhas
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // símbolos de depuração de código nativo (se alguma dependência trouxer .so)
            ndk { debugSymbolLevel 'FULL' }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
