plugins { id 'com.android.application' }

// Upload key fora do repositório — ver keystore/README.md.
// Lida de variáveis de ambiente (CI: GitHub Secrets) ou de ~/.gradle/gradle.properties.
def signProp = { String env, String prop ->
    System.getenv(env) ?: (project.hasProperty(prop) ? project.property(prop) : null)
}
def ksPath  = signProp("ANDROID_KEYSTORE_PATH", "contaComigo.keystorePath")
def ksPass  = signProp("ANDROID_KEYSTORE_PASS", "contaComigo.keystorePass")
def ksAlias = signProp("ANDROID_KEY_ALIAS", "contaComigo.keyAlias")
def keyPass = signProp("ANDROID_KEY_PASS", "contaComigo.keyPass")
def hasSigning = ksPath && ksPass && ksAlias && keyPass && file(ksPath).exists()

android {
    namespace 'com.klivfy.conta.comigo.matematica'
    compileSdk 36

    defaultConfig {
        applicationId "com.klivfy.conta.comigo.matematica"
        minSdk 24
        targetSdk 36        // o Google Play exige API 36
        versionCode 263        // v2.6.3
        versionName "2.6.3"
    }

    signingConfigs {
        if (hasSigning) {
            release {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            // Sem keystore configurado, o release sai sem assinatura (não instalável).
            if (hasSigning) signingConfig signingConfigs.release
            // R8: encolhe o código; o mapping.txt vai dentro do .aab e o Play o usa para desofuscar falhas
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // símbolos de depuração de código nativo (se alguma dependência trouxer .so)
            ndk { debugSymbolLevel 'FULL' }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // appcompat 1.7 usa Kotlin 1.8.22; o androidbrowserhelper 2.5.0 ainda puxa o jdk7/jdk8 1.6.21.
    // O BOM alinha tudo na mesma versão e evita "Duplicate class kotlin.*".
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
