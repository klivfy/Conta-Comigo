<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conta Comigo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="deco d1">➕</div>
  <div class="deco d2">🔢</div>
  <div class="deco d3">✨</div>

  <div id="app">
    <header id="topbar">
      <div class="btn-group">
        <button id="btn-home" class="icon-btn" data-i18n-title="home" aria-label="🏠">🏠</button>
        <button id="btn-profile" class="icon-btn" aria-label=" 👥">🧑‍🤝‍🧑</button>
      </div>
      <div class="btn-group">
        <div id="star-chip" title="⭐">⭐ <span id="star-total">0</span></div>
        <div id="chip-streak">🔥 <b>0</b></div>
      </div>
      <div class="btn-group">
        <button id="btn-mute" class="icon-btn" aria-label="🔊">🔊</button>
        <button id="btn-full" class="icon-btn" aria-label="⛶">⛶</button>
        <button id="btn-gear" class="icon-btn" aria-label="⚙️">⚙️</button>
        <button id="btn-close" class="icon-btn icon-close hidden" title="✕ Fechar" aria-label="✕">✕</button>
      </div>
    </header>

    <main id="screens">

      <!-- TELA INICIAL -->
      <section id="screen-home" class="screen">
        <div class="home-hero">
          <div class="hero-brand">
            <div class="mascot" id="mascot-home"><span class="mascot-main">🥚</span></div>
            <div class="hero-titlebox">
              <h1 class="title" data-i18n="appName">Conta Comigo</h1>
              <p class="subtitle" data-i18n="subtitle">Vamos brincar com os números!</p>
            </div>
          </div>
          <aside class="hero-side">
            <div class="side-card pet-card">
              <span class="pet-emoji" id="mascot-side">🥚</span>
              <div class="pet-lines">
                <div id="mascot-stage"></div>
                <div id="mascot-next"></div>
                <div id="goal-line"></div>
              </div>
            </div>
            <div class="side-card missions-card">
              <div class="m-title" data-i18n="missions">Missões de hoje</div>
              <div id="week-strip"></div>
              <div id="mission-row"></div>
            </div>
          </aside>
        </div>
        <div class="home-controls">
          <div class="special-row">
            <button id="sp-review" class="hidden"><b>📚</b><span>Revisar</span></button>
            <button id="sp-boss" class="hidden"><b>⚔️</b><span data-i18n="sp_boss">Chefe</span></button>
            <button id="sp-duel"><b>👥</b><span data-i18n="sp_duel">Duelo</span></button>
            <button id="sp-diag"><b>🎯</b><span data-i18n="sp_diag">Meu nível</span></button>
          </div>
          <div class="diff-row" role="group" aria-label="Dificuldade">
            <span class="diff-label" data-i18n="difficulty">Dificuldade:</span>
            <button class="diff-chip" data-d="auto">🤖 Auto</button>
            <button class="diff-chip" data-d="1">🌱 1</button>
            <button class="diff-chip" data-d="2">🌿 2</button>
            <button class="diff-chip" data-d="3">🌳 3</button>
            <button class="diff-chip" data-d="4">⛰️ 4</button>
            <button class="diff-chip" data-d="5">🚀 5</button>
          </div>
        </div>
        <h2 class="sec-title" data-i18n="pick_game">Escolha um jogo</h2>
        <div class="modes" id="modes-grid"></div>
        <div class="link-row">
          <button id="btn-shop">🛒 <span data-i18n="shop">Loja</span></button>
          <button id="btn-ach">🏅 <span data-i18n="ach">Conquistas</span></button>
        </div>
        <p class="tip" data-i18n="tip">Toque em um modo para começar! 👆</p>
      </section>

      <!-- TELA DO JOGO -->
      <section id="screen-game" class="screen">
        <div id="progress"><div id="dots"></div><span id="combo-chip" class="hidden"></span><span id="pts-chip" class="hidden">⚡ <b>0</b></span><span id="level-chip"></span></div>
        <div id="timer-wrap" class="hidden" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i id="timer-bar"></i></div>
        <div id="visual"></div>
        <div id="equation"></div>
        <div id="answers"></div>
        <button id="btn-repeat">🔊 <span data-i18n="repeat">Ouvir de novo</span></button>
        <div id="bubble" class="hidden">
          <span id="bubble-emoji">🦊</span>
          <span id="bubble-text"></span>
        </div>
      </section>

      <!-- TELA FINAL -->
      <section id="screen-end" class="screen">
        <div class="mascot"><span class="mascot-main">🥳</span></div>
        <h2 id="end-title">Muito bem!</h2>
        <div id="stars-earned"></div>
        <div id="end-pts" class="hidden"></div>
        <p id="end-msg"></p>
        <div id="end-history"></div>
        <div class="end-actions">
          <button id="btn-again" class="big-btn" data-i18n="again">Jogar de novo 🔁</button>
          <button id="btn-menu" class="big-btn alt" data-i18n="menu">Trocar modo 🏠</button>
        </div>
      </section>

      <!-- TELA DO DUELO -->
      <section id="screen-duel" class="screen">
        <h2 data-i18n="duel_title">Duelo de contas!</h2>
        <p class="subtitle" data-i18n="duel_choose">Escolha os avatares</p>
        <div class="duel-pick">
          <b>1</b>
          <div class="av-row" id="duel-av1"></div>
          <b>2</b>
          <div class="av-row" id="duel-av2"></div>
        </div>
        <div class="end-actions">
          <button id="btn-duel-go" class="big-btn" data-i18n="duel_start">Começar!</button>
          <button id="duel-back" class="big-btn alt" data-i18n="menu">Trocar modo 🏠</button>
        </div>
      </section>

      <!-- TELA DA LOJA -->
      <section id="screen-shop" class="screen">
        <div class="shop-head">
          <button id="shop-back" class="icon-btn" aria-label="🏠">🏠</button>
          <h2 data-i18n="shop">Loja</h2>
          <div id="shop-stars">⭐ 0</div>
        </div>
        <div class="shop-sec"><b data-i18n="shop_themes">Temas</b><div class="shop-row" id="shop-themes"></div></div>
        <div class="shop-sec"><b data-i18n="shop_hats">Acessórios</b><div class="shop-row" id="shop-hats"></div></div>
        <div class="shop-sec">
          <b data-i18n="shop_stickers">Figurinhas</b>
          <div class="end-actions" style="margin-top:8px"><button id="btn-sticker" class="big-btn" data-i18n="buy_sticker">Comprar figurinha</button></div>
          <div id="album-count"></div>
          <div id="album-grid"></div>
        </div>
      </section>

      <!-- TELA DE CONQUISTAS -->
      <section id="screen-ach" class="screen">
        <div class="shop-head">
          <button id="ach-back" class="icon-btn" aria-label="🏠">🏠</button>
          <h2 data-i18n="ach">Conquistas</h2>
          <div style="width:44px"></div>
        </div>
        <div id="ach-grid"></div>
      </section>

    </main>

    <div id="pop-profile" class="popover hidden"></div>
    <div id="overlay" class="hidden"><div id="overlay-card"></div></div>
    <div id="toast" class="hidden"></div>
    <div id="fx"></div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
