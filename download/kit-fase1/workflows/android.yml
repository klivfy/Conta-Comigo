name: Android (TWA — APK e AAB)

on:
  push:
    branches: [main]
    paths:
      - 'native/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Gradle 8.10.2
        # ação de terceiros fixada por commit; o Dependabot propõe as próximas versões
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.10.2'

      - name: Restaurar keystore dos secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "[ERRO] secret ANDROID_KEYSTORE_BASE64 ausente — ver native/android/keystore/README.md"; exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build release (APK + AAB assinados)
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          cd native/android
          gradle assembleRelease bundleRelease --no-daemon

      - name: Conferir fingerprint do keystore vs assetlinks.json
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          FP=$(keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" \
               -storepass "$ANDROID_KEYSTORE_PASS" -alias "$ANDROID_KEY_ALIAS" \
               | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr 'A-Z' 'a-z')
          echo "fingerprint do keystore: $FP"
          tr -d ':' < native/android/assetlinks.json | tr 'A-Z' 'a-z' | grep -q "$FP" \
            && echo "[OK] assetlinks.json confere com o keystore" \
            || { echo "[ERRO] fingerprint divergente — atualizar assetlinks.json"; exit 1; }

      - name: Extrair versão
        id: ver
        run: echo "tag=$(grep -o 'versionName "[^"]*"' native/android/app/build.gradle | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Apagar keystore do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: conta-comigo-android-${{ steps.ver.outputs.tag }}
          path: |
            native/android/app/build/outputs/apk/release/*.apk
            native/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
