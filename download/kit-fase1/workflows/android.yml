name: Android (Capacitor — APK e AAB)

# O jogo vai dentro do app (native/android, Capacitor 8): nada é carregado da web,
# então o app não depende do GitHub Pages nem do Digital Asset Links. Com os
# secrets da upload key o APK e o AAB saem assinados; sem eles (por exemplo, num PR
# de fork) saem sem assinatura, só para provar que o projeto compila.

on:
  push:
    branches: [main]
    paths:
      - 'native/android/**'
      - 'scripts/build_pwa.py'
      - 'scripts/build_android_www.py'
      - 'scripts/cc_build.py'
      - 'scripts/fonts/**'
      - 'download/conta-comigo/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'native/android/**'
      - 'scripts/build_pwa.py'
      - 'scripts/build_android_www.py'
      - 'scripts/cc_build.py'
      - 'scripts/fonts/**'
      - 'download/conta-comigo/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar Pillow (ícones)
        run: pip install pillow

      - name: Gerar o jogo para o app (PWA → native/android/www, ícones e abertura)
        run: python scripts/build_android_www.py
        env:
          BASE: ${{ github.workspace }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Dependências (Capacitor + plugins de voz, armazenamento, backup e Voltar)
        working-directory: native/android
        run: npm ci

      - name: Copiar o jogo para o projeto Gradle
        working-directory: native/android
        run: npx cap sync android

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Gradle 8.14.3
        # ação de terceiros fixada por commit; o Dependabot propõe as próximas versões
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.14.3'

      - name: Restaurar keystore dos secrets
        id: key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::secret ANDROID_KEYSTORE_BASE64 ausente: APK e AAB sem assinatura (ver native/android/keystore/README.md)"
            echo "sufixo=-sem-assinatura" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build release (APK + AAB)
        working-directory: native/android/android
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: gradle assembleRelease bundleRelease --no-daemon

      - name: Conferir o AAB (jogo dentro do pacote, sem endereço da web)
        run: |
          AAB=$(ls native/android/android/app/build/outputs/bundle/release/*.aab)
          unzip -l "$AAB" | grep -q 'base/assets/public/index.html' \
            && echo "[OK] o jogo está dentro do AAB" \
            || { echo "[ERRO] base/assets/public/index.html não está no AAB"; exit 1; }
          if unzip -p "$AAB" 'base/assets/*' | grep -aq 'klivfy.github.io'; then
            echo "[ERRO] o AAB ainda aponta para klivfy.github.io"; exit 1
          fi
          unzip -l "$AAB" | grep -q 'BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map' \
            && echo "[OK] mapping do R8 dentro do AAB" \
            || { echo "[ERRO] mapping do R8 ausente"; exit 1; }

      - name: Extrair versão
        id: ver
        run: echo "tag=$(node -p "require('./download/conta-comigo/manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Apagar keystore do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: conta-comigo-android-${{ steps.ver.outputs.tag }}${{ steps.key.outputs.sufixo }}
          path: |
            native/android/android/app/build/outputs/apk/release/*.apk
            native/android/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
