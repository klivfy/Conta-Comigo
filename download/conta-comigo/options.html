<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conta Comigo — Responsáveis</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .opt-wrap { max-width: 980px; margin: 0 auto; padding: 20px 22px 60px; }
    .opt-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .opt-head h1 { font-size: 26px; font-weight: 900; }
    .opt-card { background: var(--card); border-radius: 20px; box-shadow: 0 5px 0 rgba(var(--sh), .1); padding: 18px 20px; margin-bottom: 16px; }
    .opt-card > h2 { font-size: 18px; font-weight: 900; margin-bottom: 12px; color: var(--ink); }
    .opt-row { display: flex; align-items: center; gap: 12px; padding: 7px 0; flex-wrap: wrap; }
    .opt-row label { flex: 1 1 220px; font-weight: 700; font-size: 14.5px; }
    .opt-row select, .opt-row input[type="number"] { font-family: inherit; font-size: 14px; padding: 8px 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); color: var(--ink); }
    .opt-row input[type="range"] { width: 180px; }
    .opt-row input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--blue); }
    .opt-note { font-size: 12.5px; color: var(--ink-soft); font-weight: 700; margin-top: 4px; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
    .stat { background: rgba(var(--sh), .06); border-radius: 14px; padding: 12px; text-align: center; }
    .stat b { display: block; font-size: 22px; font-weight: 900; }
    .stat span { font-size: 12px; font-weight: 800; color: var(--ink-soft); }
    .map-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
    .map-row:last-child { border-bottom: none; }
    .map-mode { flex: 0 0 170px; font-weight: 800; font-size: 14px; display: flex; gap: 7px; align-items: center; }
    .map-bar { flex: 1; height: 12px; background: rgba(var(--sh), .1); border-radius: 999px; overflow: hidden; min-width: 80px; }
    .map-bar i { display: block; height: 100%; background: var(--green); border-radius: 999px; }
    .map-dots { display: flex; gap: 4px; }
    .lv-dot { width: 22px; height: 22px; border-radius: 50%; font-size: 10px; font-weight: 900; display: flex; align-items: center; justify-content: center; color: #fff; background: rgba(var(--sh), .18); }
    .lv-dot.g { background: var(--green); } .lv-dot.y { background: var(--yellow); color: #5c4300; } .lv-dot.r { background: var(--red); }
    .week-bars { display: flex; gap: 14px; align-items: flex-end; height: 90px; padding-top: 6px; }
    .week-bar { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
    .week-bar i { width: 34px; background: var(--blue); border-radius: 8px 8px 0 0; display: block; }
    .week-bar span { font-size: 11px; font-weight: 800; color: var(--ink-soft); }
    .prof-line { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); flex-wrap: wrap; }
    .prof-line .av-row { margin: 0; }
    .prof-line .av-row .av { width: 36px; height: 36px; font-size: 19px; }
    .prof-line input { font-family: inherit; font-size: 14px; padding: 7px 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); color: var(--ink); width: 150px; }
    .danger-btn { background: var(--red); box-shadow: 0 3px 0 var(--red-dark); }
    .gate-card { max-width: 460px; margin: 60px auto; text-align: center; background: var(--card); border-radius: 24px; padding: 34px; box-shadow: 0 10px 26px rgba(0, 0, 0, .18); }
    .gate-card h2 { font-size: 22px; font-weight: 900; margin-bottom: 6px; }
    .gate-q { font-size: 40px; font-weight: 900; margin: 14px 0; }
    .gate-card input { font-size: 24px; width: 130px; text-align: center; padding: 10px; border-radius: 12px; border: 3px solid var(--line); font-family: inherit; font-weight: 900; }
    .gate-err { color: var(--red); font-weight: 800; min-height: 22px; margin-top: 8px; }
    textarea#imp-area { width: 100%; min-height: 90px; font-family: monospace; font-size: 12px; padding: 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--ink); margin: 8px 0; }
    .btn-line { display: flex; gap: 10px; flex-wrap: wrap; }
  </style>
  <script src="js/boot.js"></script>
</head>
<body class="page-mode">
  <div id="app">
    <div class="opt-wrap">
      <header class="opt-head">
        <button id="opt-back" class="icon-btn" aria-label="🏠">🏠</button>
        <h1>🛠️ <span data-i18n="gate_title">Área dos responsáveis</span></h1>
      </header>

      <!-- PORTÃO PARENTAL (S25) -->
      <div id="gate" class="gate-card">
        <div class="mascot"><span class="mascot-main">🦊</span></div>
        <h2 data-i18n="gate_title">Área dos responsáveis</h2>
        <p data-i18n="gate_msg">Para entrar, resolva esta conta:</p>
        <div class="gate-q" id="gate-q">7 × 8</div>
        <input id="gate-in" type="number" inputmode="numeric" autocomplete="off">
        <div class="gate-err" id="gate-err"></div>
        <button id="gate-go" class="big-btn" data-i18n="gate_enter">Entrar</button>
      </div>

      <!-- CONTEÚDO -->
      <div id="opt-content" class="hidden">

        <div class="opt-card">
          <h2>📊 <span data-i18n="dash">Painel de progresso</span></h2>
          <div class="opt-row">
            <label data-i18n="profiles">Jogadores</label>
            <select id="dash-prof"></select>
          </div>
          <div class="stat-grid" id="stat-grid"></div>
          <h2 style="margin-top:16px">🗺️ <span data-i18n="d_map">Mapa de domínio</span></h2>
          <div id="map-rows"></div>
          <h2 style="margin-top:16px">📈 <span data-i18n="d_weeks">Evolução semanal</span></h2>
          <div class="week-bars" id="week-bars"></div>
        </div>

        <div class="opt-card">
          <h2>🧑‍🤝‍🧑 <span data-i18n="profiles">Jogadores</span></h2>
          <div id="prof-list"></div>
          <button class="mini-btn" id="btn-new-prof" style="margin-top:10px" data-i18n="add_profile">Adicionar jogador</button>
        </div>

        <div class="opt-card">
          <h2>🎮 <span data-i18n="game_set">Jogo</span></h2>
          <div class="opt-row"><label data-i18n="s_diff">Dificuldade</label>
            <select id="set-diff">
              <option value="auto">🤖 Auto</option><option value="1">🌱 1</option><option value="2">🌿 2</option>
              <option value="3">🌳 3</option><option value="4">⛰️ 4</option><option value="5">🚀 5</option>
            </select>
          </div>
          <div class="opt-row"><label data-i18n="s_unlock">Destravar todos os modos</label><input type="checkbox" id="set-unlock"></div>
          <div class="opt-row"><label data-i18n="s_newtab">Continha na nova aba</label><input type="checkbox" id="set-newtab"></div>
          <p class="opt-note" data-i18n="s_newtab_note"></p>
        </div>

        <div class="opt-card">
          <h2>🔊 <span data-i18n="sound_set">Som e voz</span></h2>
          <div class="opt-row"><label data-i18n="s_lang">Idioma</label>
            <select id="set-lang"><option value="pt">Português (BR)</option><option value="en">English</option><option value="es">Español</option></select>
          </div>
          <div class="opt-row"><label data-i18n="s_mute">Silenciar</label><input type="checkbox" id="set-mute"></div>
          <div class="opt-row"><label data-i18n="s_vol">Volume</label><input type="range" id="set-vol" min="0" max="100" step="5"></div>
          <div class="opt-row"><label data-i18n="s_rate">Velocidade da voz</label><input type="range" id="set-rate" min="60" max="140" step="5"></div>
          <div class="opt-row"><label data-i18n="s_pitch">Tom da voz</label><input type="range" id="set-pitch" min="50" max="200" step="5"></div>
          <div class="opt-row"><label data-i18n="s_voice">Voz da narração</label><select id="set-voice"></select></div>
        </div>

        <div class="opt-card">
          <h2>🎨 <span data-i18n="a11y_set">Aparência e acessibilidade</span></h2>
          <div class="opt-row"><label data-i18n="s_theme">Tema</label>
            <select id="set-theme">
              <option value="classico"></option><option value="espaco"></option>
              <option value="jardim"></option><option value="arcoiris"></option>
            </select>
          </div>
          <div class="opt-row"><label data-i18n="s_hc">Alto contraste</label><input type="checkbox" id="set-hc"></div>
          <div class="opt-row"><label data-i18n="s_dys">Fonte para dislexia</label><input type="checkbox" id="set-dys"></div>
          <div class="opt-row"><label data-i18n="s_calmo">Modo calmo</label>
            <select id="set-calmo"><option value="auto"></option><option value="on"></option><option value="off"></option></select>
          </div>
        </div>

        <div class="opt-card">
          <h2>⏱️ <span data-i18n="time_set">Tempo e metas</span></h2>
          <div class="opt-row"><label data-i18n="s_goal">Meta diária (rodadas)</label>
            <select id="set-goal"><option value="0"></option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="5">5</option></select>
          </div>
          <div class="opt-row"><label data-i18n="s_limit">Limite de sessão (minutos)</label>
            <select id="set-limit"><option value="0"></option><option value="10">10</option><option value="15">15</option><option value="20">20</option><option value="30">30</option></select>
          </div>
          <div class="opt-row"><label data-i18n="s_sync">Sincronizar entre computadores</label><input type="checkbox" id="set-sync"></div>
          <p class="opt-note" data-i18n="s_sync_note"></p>
        </div>

        <div class="opt-card">
          <h2>💾 <span data-i18n="data_set">Dados</span></h2>
          <div class="btn-line">
            <button class="mini-btn" id="btn-export" data-i18n="exp_btn">Exportar (arquivo)</button>
            <button class="mini-btn" id="btn-copy" data-i18n="exp_copy">Copiar</button>
            <button class="mini-btn" id="btn-import" data-i18n="imp_btn">Importar do texto</button>
            <label class="mini-btn" for="imp-file" style="display:inline-flex;align-items:center" data-i18n="imp_file">Importar arquivo</label>
            <input type="file" id="imp-file" accept=".json,application/json" style="display:none">
          </div>
          <textarea id="imp-area" placeholder="…"></textarea>
          <div class="btn-line" style="margin-top:10px">
            <button class="mini-btn danger-btn" id="btn-reset-p" data-i18n="reset_p">Apagar progresso deste jogador</button>
            <button class="mini-btn danger-btn" id="btn-reset-all" data-i18n="reset_all">Apagar tudo</button>
          </div>
          <p class="opt-note" id="opt-version"></p>
          <p class="opt-note" data-i18n="store_note"></p>
        </div>

      </div>
    </div>
    <div id="toast" class="hidden"></div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/options.js"></script>
</body>
</html>
